<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090318" />
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script>
      if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
        const analytics = document.createElement('script');
        analytics.defer = true;
        analytics.src = '/_vercel/insights/script.js';
        document.head.appendChild(analytics);
      }
    </script>
    <title>LUTA — Duelo Neon</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <div class="marquee" aria-hidden="true">
        <span>✦ ARENA ZERO // TRANSMISSÃO AO VIVO ✦</span>
        <span>✦ ARENA ZERO // TRANSMISSÃO AO VIVO ✦</span>
      </div>
      <div class="cabinet">
        <canvas id="game" width="960" height="540" aria-label="Jogo de luta 2D LUTA"></canvas>
        <div id="touch-controls" class="touch-controls" aria-label="Controles de toque">
          <div class="touch-group movement">
            <button data-key="a" aria-label="Mover para esquerda">◀</button>
            <button data-key="w" aria-label="Pular">▲</button>
            <button data-key="d" aria-label="Mover para direita">▶</button>
            <button data-key="s" aria-label="Defender">◆</button>
          </div>
          <div class="touch-group attacks">
            <button data-key="j" class="light" aria-label="Golpe leve">J</button>
            <button data-key="k" class="heavy" aria-label="Golpe pesado">K</button>
            <button data-key="l" class="special" aria-label="Golpe especial">L</button>
          </div>
        </div>
      </div>
      <p class="screen-tip">F: tela cheia · Esc: sair · Áudio é ativado no primeiro comando</p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
